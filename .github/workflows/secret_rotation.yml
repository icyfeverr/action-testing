name: Secret Rotation

# Runs on a schedule to let Terraform evaluate time_rotating resources.
# When a password's rotation_days interval has elapsed, Terraform will:
#   1. Generate a new random_password
#   2. Update the Cloud SQL user password
#   3. Write a new Secret Manager secret version
#   4. Force a new Cloud Run revision so containers pick up the new credentials
#
# The schedule here should be more frequent than password_rotation_days so that
# rotations are applied promptly. Default rotation is every 90 days; this runs weekly.
# Adjust the cron and/or password_rotation_days in variables.tf to suit your policy.

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:      # Allow manual trigger

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.7.0'
  TF_WORKING_DIR: './terraform'
  GCP_REGION: 'us-central1'

jobs:
  rotate:
    name: Rotate Secrets
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load database config
        run: |
          TF_VAR_databases=$(python3 -c "
          import yaml, json
          with open('databases.yml') as f:
              data = yaml.safe_load(f)
          print(json.dumps(data['databases']))
          ")
          echo "TF_VAR_databases=$TF_VAR_databases" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="gcp_region=${{ env.GCP_REGION }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="smtp_host=${{ secrets.SMTP_HOST }}" \
            -var="smtp_user=${{ secrets.SMTP_USER }}" \
            -var="smtp_pass=${{ secrets.SMTP_PASS }}" \
            -var="email_from=${{ secrets.SMTP_USER }}" \
            -var="github_app_private_key_b64=${{ secrets.GH_APP_PRIVATE_KEY_B64 }}" \
            -var="internal_api_secret=${{ secrets.INTERNAL_API_SECRET }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

      # Belt-and-suspenders: force a new Cloud Run revision after Terraform has
      # written the new secret version and updated the Cloud Run service spec.
      # Terraform's annotation-based rotation trigger handles this automatically,
      # but this step ensures a fresh revision even if the Cloud Run resource was
      # not in the Terraform diff (e.g., no annotation change detected).
      - name: Force Cloud Run revision after rotation
        working-directory: '.'
        run: |
          gcloud run services update breaks-app \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --update-labels="rotation-applied=$(date +%s)"
